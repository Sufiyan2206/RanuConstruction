[tool.ruff]
line-length = 180
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501", "UP007", "B904", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011"]
"migrations/*" = ["F401", "I001", "W291", "W293"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
