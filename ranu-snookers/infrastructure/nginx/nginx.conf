# Edge reverse proxy: TLS termination (or behind Cloudflare), API + WebSocket + SPA.
upstream ranu_api { server api:8000; keepalive 32; }
upstream ranu_web { server web:80; }

limit_req_zone $binary_remote_addr zone=public:10m rate=20r/s;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name _;
  client_max_body_size 5m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Real client IP when behind Cloudflare (keep list updated) — enable in production:
  # set_real_ip_from 173.245.48.0/20; ... real_ip_header CF-Connecting-IP;

  location /api/v1/ws/ {
    proxy_pass http://ranu_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
  location /api/ {
    limit_req zone=public burst=40 nodelay;
    proxy_pass http://ranu_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }
  location ~ ^/(health|ready|metrics)$ {
    proxy_pass http://ranu_api;
    allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all;
  }
  location / { proxy_pass http://ranu_web; proxy_set_header Host $host; }
}
